<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efe8da">
  <meta name="description" content="左右に行き来する布の帯をタップで止めて、下の段に重ねて織り上げる。はみ出たぶんは切り落とされるので、ぴったり止めて細くしないのがこつ。">
  <title>SHUTTLE STOP — 行き来する布を止めて織る</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SHUTTLE STOP">
  <meta property="og:title" content="SHUTTLE STOP — 行き来する布を止めて織る">
  <meta property="og:description" content="左右に行き来する布の帯をタップで止めて、下の段に重ねて織り上げる。はみ出たぶんは切り落とされるので、ぴったり止めて細くしないのがこつ。">
  <meta property="og:url" content="https://t-of.github.io/shuttle-stop/">
  <meta property="og:image" content="https://t-of.github.io/shuttle-stop/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SHUTTLE STOP">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <section class="title" id="title">
    <h1 class="title__name">SHUTTLE STOP</h1>
    <p class="title__tag">行き来する布を止めて織る</p>
    <canvas class="title__sample" id="sample" aria-hidden="true"></canvas>
    <ol class="howto">
      <li>行き来する布を、タップで止める</li>
      <li>はみ出たぶんは切り落とされる</li>
      <li>ぴったりは幅そのまま。重ならなければ終わり</li>
    </ol>
    <p class="title__best">ベスト <span id="titleBest">0 段</span></p>
    <button class="big" id="start">はじめる</button>
    <div class="title__sub">
      <button class="pill" data-wak="install" hidden>アプリにする</button>
      <button class="pill" data-wak="share">共有</button>
      <button class="pill" id="sound" aria-pressed="true">音 オン</button>
    </div>
    <p class="credit"><a href="/">T.OF...</a> のアプリ・<a href="https://t-of.github.io/contact/">問い合わせ</a></p>
  </section>

  <section class="play" id="play" hidden>
    <header class="hud">
      <p class="hud__rows"><b id="rows">0</b> 段</p>
      <p class="hud__perfect">ぴったり <b id="perfect">0</b></p>
    </header>
    <div class="stage" id="stageWrap">
      <canvas id="stage"></canvas>
    </div>

    <div class="result" id="result" hidden>
      <div class="result__card">
        <h2 class="result__title">織りあがり</h2>
        <p class="result__score"><span><b id="rRows">0</b> 段</span><span>ぴったり <b id="rPerfect">0</b> 回</span></p>
        <p class="result__new" id="rNew" hidden>ベスト更新</p>
        <p class="result__best" id="rBest"></p>
        <button class="big" id="again">もう一度</button>
        <div class="result__row">
          <button class="pill" id="shareResult">共有</button>
          <button class="pill" id="toTitle">タイトルへ</button>
        </div>
      </div>
    </div>
  </section>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
